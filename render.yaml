# Render deploy config for the tracker backend (Docker, so Chrome is available).
services:
  - type: web
    name: tracker-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # A browser-per-request is memory-hungry; free/starter (512MB) can OOM.
    # Use a plan with >=2GB RAM for reliability.
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: HEADLESS
        value: "false"
      - key: SOLVE_CAPTCHA
        value: "false"
      - key: MAX_RETRIES
        value: "2"
      # Deployed frontend origin(s), comma-separated. Exact — no trailing slash.
      - key: CORS_ORIGINS
        value: "https://tracker-frontend-tawny.vercel.app"
      # For real volume, add residential proxies:
      # - key: USE_PROXIES
      #   value: "true"
      # - key: PROXY_URL
      #   value: "USER:PASS@gate.provider.com:7000"
